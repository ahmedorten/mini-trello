version: 1
project:
  name: CRM Customer Support
  primaryLanguage: typescript
  projectRoots:
    - .
tracker:
  type: azure
  workspace: AhmedOrten
  project: CRM_Customer_Support
naming:
  includeTrackerId: true
  globalSequence: true
agents: []
planner:
  enabled: true
  provider: anthropic
  mode: auto
  budget:
    maxFileReads: 25
    maxContextBytes: 50000
    maxDurationSeconds: 180
  cache:
    enabled: true
  maxOutputTokens: 16384
